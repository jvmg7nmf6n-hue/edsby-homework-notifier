name: School Progress Backfill

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD, maximum 31 days)"
        required: true
      to_date:
        description: "End date (YYYY-MM-DD; defaults to today)"
        required: false
      dry_run:
        description: "Fetch real sources but do not send notifications"
        type: boolean
        default: false

concurrency:
  group: school-monitor-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        if: ${{ vars.EDSBY_ENABLED != 'false' }}
        run: npx playwright install --with-deps chromium

      - name: Run backfill
        env:
          EDSBY_ENABLED: ${{ vars.EDSBY_ENABLED || 'true' }}
          EDSBY_CONFIG_JSON: ${{ secrets.EDSBY_CONFIG_JSON }}
          EDSBY_BASE_URL: ${{ secrets.EDSBY_BASE_URL }}
          EDSBY_PARENT_HOME_URL: ${{ secrets.EDSBY_PARENT_HOME_URL }}
          EDSBY_CHILDREN_JSON: ${{ secrets.EDSBY_CHILDREN_JSON }}
          EDSBY_EMAIL: ${{ secrets.EDSBY_EMAIL }}
          EDSBY_PASSWORD: ${{ secrets.EDSBY_PASSWORD }}
          GMAIL_ENABLED: ${{ vars.GMAIL_ENABLED || 'false' }}
          GMAIL_ACCOUNT_EMAIL: ${{ secrets.GMAIL_ACCOUNT_EMAIL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ secrets.GMAIL_QUERY }}
          GMAIL_CHILD_ID: ${{ secrets.GMAIL_CHILD_ID }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY || secrets.NTFY_TOPIC }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_ALERTS_TOPIC: ${{ secrets.NTFY_ALERTS_TOPIC }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          TO_DATE: ${{ github.event.inputs.to_date }}
        run: npm run backfill

      - name: Commit encrypted state
        if: always()
        run: |
          if [ -f data/state.enc.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/state.enc.json
            git diff --cached --quiet || git commit -m "Update encrypted backfill state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

