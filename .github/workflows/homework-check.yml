name: Edsby Homework Check

on:
  schedule:
    # 12:00 UTC == 17:00 Asia/Karachi (UTC+5, no DST) every day EXCEPT
    # Saturday (day 6 is deliberately absent from this list) -- the
    # weekday/Sunday branch itself is still decided inside run.js off the
    # real Asia/Karachi calendar date, this cron entry only controls when
    # the job fires at all.
    - cron: "0 12 * * 0,1,2,3,4,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the ntfy payload instead of sending it)"
        type: boolean
        default: false

concurrency:
  group: edsby-homework-check
  cancel-in-progress: false

permissions:
  contents: write # to commit data/*.json (dedupe log + history) back
  pages: write # to deploy the dashboard
  id-token: write # required by actions/deploy-pages

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homework check
        env:
          EDSBY_EMAIL: ${{ secrets.EDSBY_EMAIL }}
          EDSBY_PASSWORD: ${{ secrets.EDSBY_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_ALERTS_TOPIC: ${{ secrets.NTFY_ALERTS_TOPIC }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npm run check

      - name: Upload failure screenshot (if any)
        # NOT if: failure() -- a check failure (bad login/selector) is caught
        # and handled inside run.js itself (so the ntfy alert can fire and
        # the dashboard/history commit can still happen), so the job step
        # normally reports success even when a screenshot WAS saved. Always
        # attempt the upload; if-no-files-found: ignore makes this a no-op
        # on a genuinely clean run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated dedupe/history data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notified.json data/history.json
          git diff --cached --quiet || git commit -m "Update homework check data [skip ci]"
          git push

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
