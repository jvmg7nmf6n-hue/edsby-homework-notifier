name: School Progress Check

on:
  schedule:
    # Near-real-time checks every 15 minutes, 07:07-18:52 Asia/Karachi.
    - cron: "7-59/15 2-13 * * *"
    # Full daily synthesis at 17:00 Asia/Karachi, including weekends.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Notification mode"
        type: choice
        options:
          - digest
          - realtime
        default: digest
      dry_run:
        description: "Fetch real sources but do not send notifications"
        type: boolean
        default: false

concurrency:
  group: school-monitor-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A GitHub "rerun" otherwise checks out the old event SHA and its
          # state commit can be rejected after master has advanced.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ vars.EDSBY_ENABLED != 'false' }}
        run: npx playwright install --with-deps chromium

      - name: Run school check
        env:
          EDSBY_ENABLED: ${{ vars.EDSBY_ENABLED || 'true' }}
          EDSBY_CONFIG_JSON: ${{ secrets.EDSBY_CONFIG_JSON }}
          EDSBY_BASE_URL: ${{ secrets.EDSBY_BASE_URL }}
          EDSBY_PARENT_HOME_URL: ${{ secrets.EDSBY_PARENT_HOME_URL }}
          EDSBY_CHILDREN_JSON: ${{ secrets.EDSBY_CHILDREN_JSON }}
          EDSBY_EMAIL: ${{ secrets.EDSBY_EMAIL }}
          EDSBY_PASSWORD: ${{ secrets.EDSBY_PASSWORD }}
          GMAIL_ENABLED: ${{ vars.GMAIL_ENABLED || 'false' }}
          GMAIL_ACCOUNT_EMAIL: ${{ secrets.GMAIL_ACCOUNT_EMAIL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ secrets.GMAIL_QUERY }}
          GMAIL_SCHOOL_DOMAINS: ${{ secrets.GMAIL_SCHOOL_DOMAINS }}
          GMAIL_CHILD_ID: ${{ secrets.GMAIL_CHILD_ID }}
          SCHOOL_COURSES_JSON: ${{ secrets.SCHOOL_COURSES_JSON }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY || secrets.NTFY_TOPIC }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_ALERTS_TOPIC: ${{ secrets.NTFY_ALERTS_TOPIC }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '0 12 * * *' && 'digest' || 'realtime') }}
        run: npm run check

      - name: Commit encrypted state
        if: always()
        run: |
          if [ -f data/state.enc.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/state.enc.json
            git diff --cached --quiet || git commit -m "Update encrypted monitor state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload encrypted Pages artifact
        if: always() && hashFiles('docs/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy encrypted dashboard
        if: always() && hashFiles('docs/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4
